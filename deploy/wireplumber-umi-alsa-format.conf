# The q6asm backend on the Mi 10 does not deliver audio to the amps unless the
# ALSA device is opened the way speaker-test opens it: S16_LE, read/write, no
# MMAP. With PipeWire's defaults for this card (S24_LE, MMAP_INTERLEAVED) the
# PCM reports RUNNING, hw_ptr advances at 48 kHz, the whole ASoC DAPM chain
# powers up and the amps acknowledge every register write — and nothing comes
# out of the speakers.
#
# Verified on the device (18 Nov 2026) by comparing both paths while playing:
#
#   audible   speaker-test -D hw:0,0   RW_INTERLEAVED   S16_LE   period 12000
#   silent    PipeWire default         MMAP_INTERLEAVED S24_LE   period 480
#   audible   PipeWire + this file     RW_INTERLEAVED   S16_LE   period 480
#
# api.alsa.period-size/-num are kept at the values speaker-test negotiates;
# with the format and access mode right they matter less, but they cost nothing.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 12000
        api.alsa.period-num    = 4
        api.alsa.headroom      = 0
        api.alsa.disable-mmap  = true
        audio.format           = "S16LE"
        audio.rate             = 48000
        audio.channels         = 2
      }
    }
  }
]
