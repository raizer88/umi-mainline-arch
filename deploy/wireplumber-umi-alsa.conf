# SPDX-License-Identifier: CC0-1.0
#
# WirePlumber: use the plain ALSA device for the sm8250 card instead of ACP.
#
# Without a UCM for this card, ACP cannot build a playback node and WirePlumber
# falls back to "Dummy Output". The hardware volume keys then move a sink with
# no hardware behind it: the slider reacts, nothing gets quieter.
#
# A UCM was attempted first (ucm2/conf.d/snd-sm8250 + Xiaomi/umi/HiFi.conf) and
# ALSA refused to import it, so this takes the supported shortcut: bypass ACP
# and expose hw:0,0 directly.
#
# Install to /etc/wireplumber/wireplumber.conf.d/ or, per user,
# ~/.config/wireplumber/wireplumber.conf.d/.
#
# Known limitation: the resulting sink is a software mixer. wpctl changes the
# node volume, not the CS35L41 registers, so the amp level set by
# umi-audio-init is the ceiling. A UCM would give real hardware control.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = false
      }
    }
  }
]
