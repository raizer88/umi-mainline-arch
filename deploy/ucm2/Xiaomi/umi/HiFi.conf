# Xiaomi Mi 10 (umi): ADSP MultiMedia1 -> Tertiary MI2S -> two CS35L41 amps.
# Capture: WCD938x analog mics -> SoundWire -> TX macro -> MultiMedia2.
# LCV (0x42) drives the top receiver and plays the left channel, RCV (0x40)
# the bottom loudspeaker and plays the right channel (kernel patch 0008).

SectionVerb {
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		# Full analog (+20.5 dB) and digital (+12 dB) gain overdrive the
		# small speakers. +4.5 dB analog, 0 dB digital, no DRE.
		cset "name='LCV DRE Switch' 0"
		cset "name='RCV DRE Switch' 0"
		cset "name='LCV Analog PCM Volume' 4"
		cset "name='RCV Analog PCM Volume' 4"
		cset "name='LCV Digital PCM Volume' 817"
		cset "name='RCV Digital PCM Volume' 817"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# Left: top mic (AMIC5 -> WCD ADC4/INP5 -> SWR ADC3 -> TX DEC0).
	# Right: bottom mic (AMIC1 -> WCD ADC1 -> SWR ADC0 -> TX DEC1).
	# Routing and gains from the umi-mainline bring-up; channels checked by
	# tapping each end of the phone.
	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC3"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='HDR34 MUX' NO_HDR34"
		cset "name='ADC4 MUX' INP5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='ADC4 Volume' 15"
		cset "name='TX_DEC0 Volume' 98"

		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 15"
		cset "name='TX_DEC1 Volume' 98"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX3 MODE' ADC_INVALID"
		cset "name='TX0 MODE' ADC_INVALID"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
