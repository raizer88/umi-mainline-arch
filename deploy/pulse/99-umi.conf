# PulseAudio for the Mi 10 (umi) — install as ~/.config/pulse/default.pa.d/99-umi.conf
#
# PipeWire was the cause of a permanent crackle on this board and could not be
# made clean by any of: disable-mmap, S16LE, API.alsa.period-size (480..12000),
# forced quantum, max resampler quality, fixed 48 kHz, PCM soft ramp, DAPM pop
# time. The same file played clean through `aplay` and through PulseAudio.
#
# The reference port (miercolesvd/nura-mi10-umi-port) also uses PulseAudio.

set-default-sink alsa_output.platform-sound.HiFi__Speaker__sink
set-sink-volume alsa_output.platform-sound.HiFi__Speaker__sink 65536
set-sink-mute   alsa_output.platform-sound.HiFi__Speaker__sink 0
